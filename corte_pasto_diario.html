    <style>
        :root {
            --bg-main: #1E5E3A; /* Tono verde bosque corporativo para Ambiente */
            --blanco: #FFFFFF;
            --acento: #86EFAC;  /* Verde claro de acento */

            --color-barrido: #1E5E3A; /* Color verde institucional para Barrido */
            --color-covelia: #10B981; /* Color verde de respaldo para Covelia Barrido */
            --color-hidricas: #0D9488; /* Color institucional para Asuntos Hídricos (UI) */
        }

        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-main); color: var(--blanco); margin: 0; min-height: 100vh; }
        
        #map { height: 100%; width: 100%; border-radius: 8px; background-color: #f8fafc; z-index: 10; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #F3F6F9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E6EDF3; border-radius: 4px; }

        /* Ajustes para la ventana de Info de Google Maps */
        .gm-style-iw.gm-style-iw-c {
            border-radius: 8px !important;
            padding: 12px !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
        }
        .gm-style-iw-d { overflow: hidden !important; }
        button.gm-ui-hover-effect { display: none !important; }

        /* Estilos del Botón de Cierre Personalizado */
        .custom-close-btn {
            position: absolute;
            right: -4px;
            top: -6px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: #94A3B8;
            font-size: 22px;
            font-weight: bold;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.2s ease;
            z-index: 50;
        }
        .custom-close-btn:hover {
            background-color: #F1F5F9;
            color: var(--bg-main);
        }
    </style>
</head>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2MHti5Cy4IDKPc3Iu0ypNQg_BgsjcMoQ&callback=initMap" defer></script>

    <script>
        let map, infoWindow;
        let infoWindowTimer;
        let cgmLayer;
        let cortesLayer;
        let barridoLayer;
        let coveliaLayer;
        let hidricasLayer; 
        let limiteElements = []; 
        const cgmMap = new Map(); 
        let barridoGeoJsonData = null; 
        let hidricasGeoJsonData = null; 

        // --- CARGADOR DE ARCHIVOS MULTI-RUTA / CASE-INSENSITIVE FALLBACKS ---
        async function loadLayerData(paths, processor) {
            const noCache = '?v=' + new Date().getTime();
            let success = false;
            let lastError = null;

            for (let path of paths) {
                try {
                    const res = await fetch(path + noCache);
                    if (res.ok) {
                        const json = await res.json();
                        await processor(json);
                        success = true;
                        console.log(`Carga exitosa: ${path}`);
                        break;
                    } else {
                        lastError = `HTTP ${res.status}`;
                    }
                } catch (err) {
                    lastError = err.message;
                }
            }

            if (!success) {
                console.error(`Error crítico cargando de rutas:`, paths, lastError);
                document.getElementById('seccion-local-uploader').classList.remove('hidden');
            }
        }

        // --- FUNCIÓN DE NORMALIZACIÓN DE CGMs ---
        function normalizeCgmName(cgmName) {
            if (!cgmName) return "";
            return cgmName
                .trim()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "") 
                .toUpperCase();
        }

        // --- BÚSQUEDA DE PROPIEDAD CGM INSENSIBLE A MAYÚSCULAS/MINÚSCULAS ---
        function getFeatureCgmProperty(feature) {
            if (!feature) return "";
            let cgm = feature.getProperty('CGM');
            if (cgm !== undefined && cgm !== null) return String(cgm);
            cgm = feature.getProperty('cgm');
            if (cgm !== undefined && cgm !== null) return String(cgm);
            cgm = feature.getProperty('Cgm');
            if (cgm !== undefined && cgm !== null) return String(cgm);
            
            let found = "";
            if (typeof feature.forEachProperty === 'function') {
                feature.forEachProperty((val, key) => {
                    if (key.toLowerCase() === 'cgm') {
                        found = String(val);
                    }
                });
            }
            return found;
        }

        function getGeoJsonFeatureCgm(f) {
            if (!f || !f.properties) return "";
            if (f.properties.CGM) return f.properties.CGM;
            if (f.properties.cgm) return f.properties.cgm;
            if (f.properties.Cgm) return f.properties.Cgm;
            
            for (let key in f.properties) {
                if (key.toLowerCase() === 'cgm') {
                    return f.properties[key];
                }
            }
            return "";
        }

        // --- REGISTRAR CGM DE FORMA ÚNICA ---
        function registerCgm(cgmName) {
            if (!cgmName) return;
            const trimmed = cgmName.trim();
            if (!trimmed) return;
            const normalized = normalizeCgmName(trimmed);
            
            if (!cgmMap.has(normalized)) {
                cgmMap.set(normalized, trimmed);
            } else {
                const existing = cgmMap.get(normalized);
                if (existing === existing.toUpperCase() && trimmed !== trimmed.toUpperCase()) {
                    cgmMap.set(normalized, trimmed);
                }
            }
        }

        // --- PARSEO LITERAL DE FECHAS SEGURO ---
        function parseDateCustom(dateStr) {
            if (!dateStr) return null;
            dateStr = String(dateStr).trim();
            
            // Caso 1: Formato DD/MM/YYYY o D/M/YYYY
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                if (parts.length === 3) {
                    const day = parseInt(parts[0], 10);
                    const month = parseInt(parts[1], 10) - 1; 
                    const year = parseInt(parts[2], 10);
                    if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
                        return new Date(year, month, day);
                    }
                }
            }
            
            // Caso 2: Formatos de fecha YYYY-MM-DD o ISO con 'T'
            const cleanDateStr = dateStr.split('T')[0];
            const ymdRegex = /^(\d{4})-(\d{2})-(\d{2})$/;
            const ymdMatch = cleanDateStr.match(ymdRegex);
            if (ymdMatch) {
                const year = parseInt(ymdMatch[1], 10);
                const month = parseInt(ymdMatch[2], 10) - 1;
                const day = parseInt(ymdMatch[3], 10);
                if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
                    return new Date(year, month, day);
                }
            }

            // Caso 3: Formato extendido de zona horaria
            const parts = dateStr.split(/\s+/);
            if (parts.length >= 4) {
                const yearIndex = parts.findIndex(p => /^\d{4}$/.test(p));
                if (yearIndex !== -1) {
                    const year = parseInt(parts[yearIndex], 10);
                    const dayIndex = parts.findIndex((p, idx) => /^\d{1,2}$/.test(p) && idx !== yearIndex);
                    if (dayIndex !== -1) {
                        const day = parseInt(parts[dayIndex], 10);
                        const monthsMap = {
                            jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11,
                            ene: 0, abr: 3, ago: 7, dic: 11
                        };
                        let month = -1;
                        for (let p of parts) {
                            const cleanP = p.toLowerCase().substring(0, 3);
                            if (monthsMap[cleanP] !== undefined) {
                                month = monthsMap[cleanP];
                                break;
                            }
                        }
                        if (month !== -1 && !isNaN(day) && !isNaN(year)) {
                            return new Date(year, month, day);
                        }
                    }
                }
            }
            
            // Fallback robusto
            const d = new Date(dateStr);
            if (!isNaN(d.getTime())) {
                return new Date(d.getFullYear(), d.getMonth(), d.getDate());
            }
            return null;
        }

        function formatDateToShow(dateStr) {
            if (!dateStr) return '-';
            const parsed = parseDateCustom(dateStr);
            if (!parsed) return dateStr;
            const day = String(parsed.getDate()).padStart(2, '0');
            const month = String(parsed.getMonth() + 1).padStart(2, '0');
            const year = parsed.getFullYear();
            return `${day}/${month}/${year}`;
        }
        
        // --- FUNCIÓN DE EVALUACIÓN DE FECHA SEGÚN FILTRO GLOBAL (DESDE / HASTA) ---
        function isDateInGlobalRange(dateStr) {
            if (!dateStr) return true; // Si no hay fecha, permanece visible
            const featDate = parseDateCustom(dateStr);
            if (!featDate) return true;

            const desdeVal = document.getElementById('filtro-global-desde').value;
            const hastaVal = document.getElementById('filtro-global-hasta').value;
            const dateMs = featDate.getTime();

            if (desdeVal) {
                const parts = desdeVal.split('-'); // [YYYY, MM, DD]
                const desdeDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10), 0, 0, 0);
                if (dateMs < desdeDate.getTime()) return false;
            }
            if (hastaVal) {
                const parts = hastaVal.split('-'); // [YYYY, MM, DD]
                const hastaDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10), 23, 59, 59);
                if (dateMs > hastaDate.getTime()) return false;
            }
            return true;
        }
        
        // --- FUNCIÓN DE COLORES POR DÍA (GAMA AZULES CORPORATIVOS) ---
        function getColorPorDiaSemana(fechaStr) {
            const parsed = parseDateCustom(fechaStr);
            if (!parsed) return '#19567C'; 
            
            const diaSemana = parsed.getDay(); 
            
            const coloresAzul = {
                1: '#03045E', // Lunes
                2: '#023E8A', // Martes
                3: '#0077B6', // Miércoles
                4: '#0096C7', // Jueves
                5: '#00B4D8', // Viernes
                6: '#48CAE4', // Sábado
                0: '#90E0EF'  // Domingo
            };
            return coloresAzul[diaSemana] || '#19567C';
        }

        // --- CONVERTIDOR DE HSL A HEXADECIMAL ---
        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        // --- GENERADOR DETERMINISTA DE 63 TONALIDADES DE VERDE ---
        function getColorForRoute(ruta) {
            if (!ruta) return '#10B981'; 
            let hash = 0;
            const str = String(ruta);
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            hash = Math.abs(hash);
            
            const h = 85 + (hash % 71); 
            const s = 55 + (hash % 41);
            const l = 33 + (hash % 26);
            return hslToHex(h, s, l);
        }

        // --- GENERADOR DE ICONOS INTELIGENTE PARA ASUNTOS HÍDRICOS (Puntos) ---
        function getHidricasIcon(type, strokeColor = '#FFFFFF', isBlinking = false) {
            let bgColor = '#0D9488'; // Color hídrico base
            let letter = 'H'; 
            const cleanType = String(type).trim().toUpperCase();
            
            if (cleanType.includes('SUMIDERO')) {
                bgColor = '#06B6D4'; 
                letter = 'S';
            } else if (cleanType.includes('CONDUCTO') || cleanType.includes('CANAL')) {
                bgColor = '#0F766E'; 
                letter = 'C';
            } else if (cleanType.includes('ZANJA') || cleanType.includes('ZANJEO')) {
                bgColor = '#14B8A6'; 
                letter = 'Z';
            } else if (cleanType.includes('PUENTE')) {
                bgColor = '#0284C7'; 
                letter = 'P';
            }

            // Animación de Titileo/Parpadeo para elementos repetidos
            const animation = isBlinking ? `<animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>` : '';
            
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <g>
                        ${animation}
                        <circle cx="12" cy="12" r="10" fill="${bgColor}" stroke="${strokeColor}" stroke-width="3"/>

            const animation = isBlinking ? `<animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>` : '';

            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                    <g>
                        ${animation}
                        <circle cx="12" cy="12" r="10" fill="${bgColor}" stroke="${strokeColor}" stroke-width="3"/>
                        <text x="12" y="16" font-family="Montserrat, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF" text-anchor="middle">${letter}</text>
                    </g>
                </svg>
            `;
            return {
                url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                scaledSize: new google.maps.Size(24, 24),

        // --- LIMPIEZA DE GEOJSON DAÑADO Y RECONSTRUCCIÓN DEFENSIVA ---
        function sanitizeGeoJson(geoJson) {
            if (!geoJson || !geoJson.features) return geoJson;
            
            const sanitizedFeatures = geoJson.features.map(feature => {
                if (!feature.geometry || !feature.geometry.coordinates) return feature;
                
                const type = feature.geometry.type;
                const coords = feature.geometry.coordinates;
                
                try {
                    if (!Array.isArray(coords)) {
                        feature.geometry = null;
                        return feature;
                    }

                    if (type === 'Point') {
                        if (coords.length < 2 || isNaN(coords[0]) || isNaN(coords[1]) || coords[0] === null || coords[1] === null) {
                            feature.geometry = null;
                        }
                    } else if (type === 'LineString') {
                        const clean = coords.filter(c => Array.isArray(c) && c.length >= 2 && !isNaN(c[0]) && !isNaN(c[1]) && c[0] !== null && c[1] !== null);
                        if (clean.length >= 2) {
                            feature.geometry.coordinates = clean;
                        } else {
                            feature.geometry = null;
                        }
                    } else if (type === 'MultiLineString') {
                        const clean = coords.map(line => {
                            if (!Array.isArray(line)) return [];
                            return line.filter(c => Array.isArray(c) && c.length >= 2 && !isNaN(c[0]) && !isNaN(c[1]) && c[0] !== null && c[1] !== null);
                        }).filter(line => line.length >= 2);
                        if (clean.length > 0) {
                            feature.geometry.coordinates = clean;
                        } else {
                            feature.geometry = null;
                        }
                    } else if (type === 'Polygon') {
                        const clean = coords.map(ring => {
                            if (!Array.isArray(ring)) return [];
                            return ring.filter(c => Array.isArray(c) && c.length >= 2 && !isNaN(c[0]) && !isNaN(c[1]) && c[0] !== null && c[1] !== null);
                        }).filter(ring => ring.length >= 3);
                        if (clean.length > 0) {
                            feature.geometry.coordinates = clean;
                        } else {
                            feature.geometry = null;
                        }
                    } else if (type === 'MultiPolygon') {
                        const clean = coords.map(poly => {
                            if (!Array.isArray(poly)) return [];
                            return poly.map(ring => {
                                if (!Array.isArray(ring)) return [];
                                return ring.filter(c => Array.isArray(c) && c.length >= 2 && !isNaN(c[0]) && !isNaN(c[1]) && c[0] !== null && c[1] !== null);
                            }).filter(ring => ring.length >= 3);
                        }).filter(poly => poly.length > 0);
                        if (clean.length > 0) {
                            feature.geometry.coordinates = clean;
                        } else {
                            feature.geometry = null;
                        }
                    }
                } catch (err) {
                    console.error("Error sanitizando geometría:", err);
                    feature.geometry = null;
                }
                return feature;
            }).filter(f => f.geometry !== null && f.geometry !== undefined);

            return {
                ...geoJson,
                features: sanitizedFeatures
            };
        }

                cgmLayer.setStyle((feature) => {
                    const featCgm = getFeatureCgmProperty(feature);
                    const cleanFeatCgm = normalizeCgmName(featCgm);
                    let isVisible = true;
                    let opacidad = 0.25;
                    let grosor = 3;

                    if (globalCgm !== "TODOS") {
                        if (cleanFeatCgm !== globalCgm) {
                            isVisible = false; 
                        } else {
                            opacidad = 0.4; 
                            grosor = 4;
                        }
                    }

                    return {
                        fillColor: '#86EFAC', 
                        fillOpacity: opacidad, 
                        strokeColor: '#1E5E3A', 
                        strokeWeight: grosor,        
                        strokeOpacity: 0.9, 
                        zIndex: 1,
                        visible: isVisible
                    };
                });
            }

            function updateCortesStyles() {
                const globalCgmSelect = document.getElementById('filtro-global-cgm');
                const globalCgm = globalCgmSelect ? globalCgmSelect.value : "TODOS";
                const fechaSelect = document.getElementById('filtro-fecha');
                const fechaFiltro = fechaSelect ? fechaSelect.value : "TODAS";

                // Map para detectar puntos duplicados (titilantes) en la visualización actual
                const freqMap = new Map();

                // 1. Contar ocurrencias válidas bajo los filtros actuales
                cortesLayer.forEach((feature) => {
                    const featCgm = getFeatureCgmProperty(feature);
                    const cleanFeatCgm = normalizeCgmName(featCgm);
                    const featFechaOriginal = feature.getProperty('Fecha_str'); 
                    const featFechaClean = formatDateToShow(featFechaOriginal);
                    let isVisible = true;

                    if (globalCgm !== "TODOS" && cleanFeatCgm !== globalCgm) isVisible = false;
                    if (fechaFiltro !== "TODAS" && featFechaClean !== fechaFiltro) isVisible = false;
                    if (!isDateInGlobalRange(featFechaOriginal)) isVisible = false;

                    if (isVisible) {
                        const geom = feature.getGeometry();
                        if (geom && geom.getType() === 'Point') {
                            const coordKey = geom.get().lat().toFixed(5) + ',' + geom.get().lng().toFixed(5);
                            freqMap.set(coordKey, (freqMap.get(coordKey) || 0) + 1);
                        }
                    }
                });

                // 2. Aplicar estilos con animación a duplicados
                cortesLayer.setStyle((feature) => {
                    const featCgm = getFeatureCgmProperty(feature);
                    const cleanFeatCgm = normalizeCgmName(featCgm);
                    const featFechaOriginal = feature.getProperty('Fecha_str'); 
                    const featFechaClean = formatDateToShow(featFechaOriginal);
                    const dynamicDayColor = getColorPorDiaSemana(featFechaOriginal); 
                    let isVisible = true;

                    if (globalCgm !== "TODOS" && cleanFeatCgm !== globalCgm) isVisible = false;
                    if (fechaFiltro !== "TODAS" && featFechaClean !== fechaFiltro) isVisible = false;
                    if (!isDateInGlobalRange(featFechaOriginal)) isVisible = false;

                    const geomType = feature.getGeometry() ? feature.getGeometry().getType() : '';

                    if (geomType === 'Point') {
                        const geom = feature.getGeometry();
                        const coordKey = geom.get().lat().toFixed(5) + ',' + geom.get().lng().toFixed(5);
                        const isBlinking = (freqMap.get(coordKey) > 1);

                        const nombreRaw = feature.getProperty('Inicio Recorrido') || feature.getProperty('PLAZA') || feature.getProperty('NOMBRE') || '';
                        const nombreUpper = nombreRaw.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
                        
                        let type = 'PLAZA';
                        if (nombreUpper.includes('ESCUELA') || nombreUpper.includes('COLEGIO') || nombreUpper.includes('JARDIN') || nombreUpper.includes('FORMACION') || nombreUpper.includes('TECNICA') || nombreUpper.includes('PRIMARIA') || nombreUpper.includes('SECUNDARIA')) {
                            type = 'ESCUELA';
                        } else if (nombreUpper.includes('POLIDEPORTIVO') || nombreUpper.includes('CLUB') || nombreUpper.includes('PREDIO') || nombreUpper.includes('DOTA')) {
                            type = 'POLIDEPORTIVO';
                        }

                        return {
                            icon: getCustomIcon(type, dynamicDayColor, isBlinking),
                            zIndex: isBlinking ? 8 : 6,
                            visible: isVisible
                        };
                    } else {
                        return {
                            fillColor: dynamicDayColor,
                            fillOpacity: 0.6,
                            strokeColor: dynamicDayColor,
                            strokeWeight: 4, 
                            zIndex: 5,
                            visible: isVisible
                        };
                    }
                });
            }

            function updateBarridoStyles() {
                const globalCgmSelect = document.getElementById('filtro-global-cgm');
                const globalCgm = globalCgmSelect ? globalCgmSelect.value : "TODOS";

                const barrenderoSelect = document.getElementById('filtro-barrendero');
                const barrenderoFiltro = barrenderoSelect ? barrenderoSelect.value : "TODOS";

                barridoLayer.setStyle((feature) => {
                    const featCgm = getFeatureCgmProperty(feature);
                    const cleanFeatCgm = normalizeCgmName(featCgm);
                    const featBarrendero = feature.getProperty('BARRENDERO') ? feature.getProperty('BARRENDERO').trim() : "";
                    let isVisible = true;

                    if (globalCgm !== "TODOS") {
                        if (cleanFeatCgm !== globalCgm) {
                            isVisible = false;
                        }
                    }

                    if (barrenderoFiltro !== "TODOS") {
                        if (featBarrendero !== barrenderoFiltro) {
                            isVisible = false;
                        }
                    }

                    return {
                        strokeColor: '#1E5E3A', 
                        strokeWeight: 5,
                        strokeOpacity: 0.85,
                        zIndex: 4,
                        visible: isVisible
                    };
                });
            }

            function updateCoveliaStyles() {
                const globalCgmSelect = document.getElementById('filtro-global-cgm');
                const globalCgm = globalCgmSelect ? globalCgmSelect.value : "TODOS";

                coveliaLayer.setStyle((feature) => {
                    const featCgm = getFeatureCgmProperty(feature);
                    const cleanFeatCgm = normalizeCgmName(featCgm);
                    let isVisible = true;

                    if (globalCgm !== "TODOS") {
                        if (cleanFeatCgm !== globalCgm) {
                            isVisible = false;
                        }
                    }

                    const rutaNum = feature.getProperty('Ruta') || feature.getProperty('ruta') || feature.getProperty('RUTA') || "";
                    const dynamicGreen = getColorForRoute(rutaNum);

                    return {
                        strokeColor: dynamicGreen,
                        strokeWeight: 4,
                        strokeOpacity: 0.9,
                        zIndex: 3,
                        visible: isVisible
                    };
                });
            }

            function updateHidricasStyles() {
                const globalCgmSelect = document.getElementById('filtro-global-cgm');
                const globalCgm = globalCgmSelect ? globalCgmSelect.value : "TODOS";
                const tipoSelect = document.getElementById('filtro-hidricas-tipo');
                const tipoFiltro = tipoSelect ? tipoSelect.value : "TODOS";
                const tareaSelect = document.getElementById('filtro-hidricas-tarea');
                const tareaFiltro = tareaSelect ? tareaSelect.value : "TODAS";
                const fechaSelect = document.getElementById('filtro-hidricas-fecha');
                const fechaFiltro = fechaSelect ? fechaSelect.value : "TODAS";

                // Map para detectar puntos de obras duplicadas (titilantes)
                const freqMap = new Map();

                // 1. Contar ocurrencias
                hidricasLayer.forEach((feature) => {
                    const featCgm = getFeatureCgmProperty(feature);
                    const cleanFeatCgm = normalizeCgmName(featCgm);
                    const featTipo = feature.getProperty('tipo') ? String(feature.getProperty('tipo')).trim() : "";
                    const featTarea = feature.getProperty('tarea') ? String(feature.getProperty('tarea')).trim() : "";
                    const featFecha = feature.getProperty('fecha');
                    const featFechaClean = formatDateToShow(featFecha);
                    let isVisible = true;

                    if (globalCgm !== "TODOS" && cleanFeatCgm !== globalCgm) isVisible = false;
                    if (tipoFiltro !== "TODOS" && featTipo !== tipoFiltro) isVisible = false;
                    if (tareaFiltro !== "TODAS" && featTarea !== tareaFiltro) isVisible = false;
                    if (fechaFiltro !== "TODAS" && featFechaClean !== fechaFiltro) isVisible = false;
                    if (!isDateInGlobalRange(featFecha)) isVisible = false;

                    if (isVisible) {
                        const geom = feature.getGeometry();
                        if (geom && geom.getType() === 'Point') {
                            const coordKey = geom.get().lat().toFixed(5) + ',' + geom.get().lng().toFixed(5);
                            freqMap.set(coordKey, (freqMap.get(coordKey) || 0) + 1);
                        }
                    }
                });

                // 2. Asignar estilos y animación
                hidricasLayer.setStyle((feature) => {
                    const featCgm = getFeatureCgmProperty(feature);
                    const cleanFeatCgm = normalizeCgmName(featCgm);
                    const featTipo = feature.getProperty('tipo') ? String(feature.getProperty('tipo')).trim() : "";
                    const featTarea = feature.getProperty('tarea') ? String(feature.getProperty('tarea')).trim() : "";
                    const featFecha = feature.getProperty('fecha');
                    const featFechaClean = formatDateToShow(featFecha);
                    let isVisible = true;

                    if (globalCgm !== "TODOS" && cleanFeatCgm !== globalCgm) isVisible = false;
                    if (tipoFiltro !== "TODOS" && featTipo !== tipoFiltro) isVisible = false;
                    if (tareaFiltro !== "TODAS" && featTarea !== tareaFiltro) isVisible = false;
                    if (fechaFiltro !== "TODAS" && featFechaClean !== fechaFiltro) isVisible = false;
                    if (!isDateInGlobalRange(featFecha)) isVisible = false;

                    const geomType = feature.getGeometry() ? feature.getGeometry().getType() : '';
                    const dynamicDayColor = getColorPorDiaSemana(featFecha);

                    if (geomType === 'Point') {
                        const geom = feature.getGeometry();
                        const coordKey = geom.get().lat().toFixed(5) + ',' + geom.get().lng().toFixed(5);
                        const isBlinking = (freqMap.get(coordKey) > 1);

                        return {
                            icon: getHidricasIcon(featTipo, dynamicDayColor, isBlinking),
                            zIndex: isBlinking ? 8 : 6,
                            visible: isVisible
                        };
                    } else {
                        return {
                            strokeColor: dynamicDayColor,
                            strokeWeight: 4,
                            strokeOpacity: 0.9,
                            fillColor: dynamicDayColor, 
                            fillOpacity: 0.3,
                            zIndex: 4,
                            visible: isVisible
                        };
                    }
                });
            }

            // Ventanas Emergentes base para CGM, Cortes de Pasto, Barrido, Covelia y Asuntos Hídricos
            function bindPopup(layer, colorTitle, layerType = 'cgm') {
                layer.addListener('click', function(event) {
                    let content = `<div style="font-family: 'Montserrat', sans-serif; min-width: 200px; position: relative;">`;
                    content += `<button onclick="window.closeInfoWindow()" class="custom-close-btn">&times;</button>`;
                    
                    if (layerType === 'corte') {
                        const geomType = event.feature.getGeometry() ? event.feature.getGeometry().getType() : '';
                        const fechaCorteOriginal = event.feature.getProperty('Fecha_str');
                        const fechaCorteClean = formatDateToShow(fechaCorteOriginal);
                        const dynamicDayColor = getColorPorDiaSemana(fechaCorteOriginal);
                        
                        if (geomType === 'Point') {
                            const nombreRaw = event.feature.getProperty('Inicio Recorrido') || event.feature.getProperty('PLAZA') || event.feature.getProperty('NOMBRE') || 'Lugar de Interés';
                            const nombreUpper = nombreRaw.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
                            
                            let colorDin = '#84CC16';
                            let tipoLabel = 'Corte en Plaza / Parque';
                            
                            if (nombreUpper.includes('ESCUELA') || nombreUpper.includes('COLEGIO') || nombreUpper.includes('JARDIN') || nombreUpper.includes('FORMACION') || nombreUpper.includes('TECNICA') || nombreUpper.includes('PRIMARIA') || nombreUpper.includes('SECUNDARIA')) { 
                                colorDin = '#F59E0B'; 
                                tipoLabel = 'Corte en Institución Educativa'; 
                            }
                            else if (nombreUpper.includes('POLIDEPORTIVO') || nombreUpper.includes('CLUB') || nombreUpper.includes('PREDIO') || nombreUpper.includes('DOTA')) { 
                                colorDin = '#0EA5E9'; 
                                tipoLabel = 'Corte en Deporte / Predio / Polideportivo'; 
                            }

                            content += `<h3 style="font-weight: 800; font-size: 14px; color: ${colorDin}; border-bottom: 1px solid #E6EDF3; padding-bottom: 4px; margin-bottom: 8px; padding-right: 20px;">${tipoLabel}</h3>`;
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Nombre:</b> ${nombreRaw}</p>`;
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Fecha:</b> ${fechaCorteClean}</p>`;
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>CGM:</b> ${getFeatureCgmProperty(event.feature) || '-'}</p>`;
                            
                            const localidad = event.feature.getProperty('Localidad');
                            if (localidad) {
                                content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Localidad:</b> ${localidad}</p>`;
                            }
                            const ubicacion = event.feature.getProperty('UBICACION') || event.feature.getProperty('DIRECCION');
                            if (ubicacion) {
                                content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Dirección:</b> ${ubicacion}</p>`;
                            }
                        } else {
                            content += `<h3 style="font-weight: 800; font-size: 14px; color: ${dynamicDayColor}; border-bottom: 1px solid #E6EDF3; padding-bottom: 4px; margin-bottom: 8px; padding-right: 20px;">Recorrido de Corte</h3>`;
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Fecha:</b> ${fechaCorteClean}</p>`;
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>CGM:</b> ${getFeatureCgmProperty(event.feature) || '-'}</p>`;
                            
                            const localidad = event.feature.getProperty('Localidad');
                            if (localidad) {
                                content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Localidad:</b> ${localidad}</p>`;
                            }
                            if(event.feature.getProperty('Inicio Recorrido')) {
                                content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Inicio:</b> ${event.feature.getProperty('Inicio Recorrido')}</p>`;
                            }
                            if(event.feature.getProperty('Fin del Recorrido')) {
                                content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Fin:</b> ${event.feature.getProperty('Fin del Recorrido')}</p>`;
                            }
                            
                            const distancia = event.feature.getProperty('Distancia');
                            if(distancia && distancia > 0) {
                                content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Distancia:</b> ${distancia} m</p>`;
                            }
                            const area = event.feature.getProperty('Area');
                            if(area && area > 0) {
                                content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Área:</b> ${area} m²</p>`;
                            }
                        }
                    } else if (layerType === 'barrido') {
                        content += `<h3 style="font-weight: 800; font-size: 14px; color: var(--color-barrido); border-bottom: 1px solid #E6EDF3; padding-bottom: 4px; margin-bottom: 8px; padding-right: 20px;">Barrido</h3>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Calle:</b> ${event.feature.getProperty('CALLE') || '-'}</p>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Barrendero:</b> ${event.feature.getProperty('BARRENDERO') || '-'}</p>`;
                        
                        const legajo = event.feature.getProperty('LEGAJO/DNI');
                        if (legajo !== undefined && legajo !== null && legajo !== "") {
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Legajo:</b> ${legajo}</p>`;
                        }
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>CGM:</b> ${getFeatureCgmProperty(event.feature) || '-'}</p>`;

                    } else if (layerType === 'covelia') {
                        const ruta = event.feature.getProperty('Ruta') || event.feature.getProperty('ruta') || event.feature.getProperty('RUTA') || '-';
                        const dynamicGreen = getColorForRoute(ruta);
                        content += `<h3 style="font-weight: 800; font-size: 14px; color: ${dynamicGreen}; border-bottom: 1px solid #E6EDF3; padding-bottom: 4px; margin-bottom: 8px; padding-right: 20px;">Ruta Covelia ${ruta}</h3>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>CGM:</b> ${getFeatureCgmProperty(event.feature) || '-'}</p>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Turno:</b> ${event.feature.getProperty('Turno') || event.feature.getProperty('turno') || event.feature.getProperty('TURNO') || '-'}</p>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Frecuencia:</b> ${event.feature.getProperty('Frecuencia') || event.feature.getProperty('frecuencia') || event.feature.getProperty('FRECUENCIA') || '-'}</p>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Horario:</b> ${event.feature.getProperty('Horario') || event.feature.getProperty('horario') || event.feature.getProperty('HORARIO') || '-'}</p>`;
                        const metros = event.feature.getProperty('Metros') || event.feature.getProperty('metros') || event.feature.getProperty('METROS');
                        if (metros) {
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Distancia:</b> ${metros} m</p>`;
                        }
                    } else if (layerType === 'hidricas') {
                        const tipo = event.feature.getProperty('tipo') || 'Elemento Hídrico';
                        const tarea = event.feature.getProperty('tarea') || '-';
                        const fechaRaw = event.feature.getProperty('fecha');
                        const fechaClean = formatDateToShow(fechaRaw);
                        const dynamicDayColor = getColorPorDiaSemana(fechaRaw);

                        content += `<h3 style="font-weight: 800; font-size: 14px; color: ${dynamicDayColor}; border-bottom: 1px solid #E6EDF3; padding-bottom: 4px; margin-bottom: 8px; padding-right: 20px;">Asuntos Hídricos</h3>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Tipo:</b> ${tipo}</p>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Tarea:</b> ${tarea}</p>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Fecha:</b> ${fechaClean}</p>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>CGM:</b> ${getFeatureCgmProperty(event.feature) || '-'}</p>`;

                        const dirDesde = event.feature.getProperty('direccion_desde');
                        const dirHasta = event.feature.getProperty('direccion_hasta');
                        if (dirDesde) {
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Dirección:</b> ${dirDesde}${dirHasta ? ' hasta ' + dirHasta : ''}</p>`;
                        }

                        const cant = event.feature.getProperty('cant');
                        if (cant !== undefined && cant !== null && cant !== "") {
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Cantidad:</b> ${cant}</p>`;
                        }

                        const obs = event.feature.getProperty('observaciones');
                        if (obs) {
                            content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Observaciones:</b> ${obs}</p>`;
                        }
                    } else { // CGM
                        content += `<h3 style="font-weight: 800; font-size: 14px; color: ${colorTitle}; border-bottom: 1px solid #E6EDF3; padding-bottom: 4px; margin-bottom: 8px; padding-right: 20px;">CGM: ${getFeatureCgmProperty(event.feature)}</h3>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Manzanas:</b> ${event.feature.getProperty('Manzanas') || '-'}</p>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Cuadras:</b> ${event.feature.getProperty('Cuadras') || '-'}</p>`;
                        content += `<p style="margin: 4px 0; font-size: 12px; color: #333;"><b>Viviendas:</b> ${event.feature.getProperty('Viviendas') || '-'}</p>`;
                    }
                    content += `</div>`;
                    
                    infoWindow.setContent(content);
                    if (event.feature.getGeometry().getType() === 'Point') {
                        infoWindow.setPosition(event.feature.getGeometry().get());
                    } else {
                        infoWindow.setPosition(event.latLng);
                    }
                    infoWindow.open(map);
                    startInfoWindowTimer(); 
                });
            }

            bindPopup(cgmLayer, '#2A7E43', 'cgm');
            bindPopup(cortesLayer, '#19567C', 'corte');
            bindPopup(barridoLayer, 'var(--color-barrido)', 'barrido');
            bindPopup(coveliaLayer, 'var(--color-covelia)', 'covelia');
            bindPopup(hidricasLayer, 'var(--color-hidricas)', 'hidricas');

            // Toggles de Capas
            document.getElementById('cb-limite').addEventListener('change', (e) => {
                const m = e.target.checked ? map : null;
                limiteElements.forEach(el => el.setMap(m));
            });

            document.getElementById('cb-cgm').addEventListener('change', (e) => {
                e.target.checked ? cgmLayer.setMap(map) : cgmLayer.setMap(null);
            });

            const cbCortes = document.getElementById('cb-cortes');
            if (cbCortes) {
                cbCortes.addEventListener('change', (e) => {
                    e.target.checked ? cortesLayer.setMap(map) : cortesLayer.setMap(null);
                });
            }

            const cbBarrido = document.getElementById('cb-barrido');
            if (cbBarrido) {
                cbBarrido.addEventListener('change', (e) => {
                    e.target.checked ? barridoLayer.setMap(map) : barridoLayer.setMap(null);
                });
            }

            const cbCovelia = document.getElementById('cb-covelia');
            if (cbCovelia) {
                cbCovelia.addEventListener('change', (e) => {
                    e.target.checked ? coveliaLayer.setMap(map) : coveliaLayer.setMap(null);
                });
            }

            const cbHidricas = document.getElementById('cb-hidricas');
            if (cbHidricas) {
                cbHidricas.addEventListener('change', (e) => {
                    e.target.checked ? hidricasLayer.setMap(map) : hidricasLayer.setMap(null);
                });
            }
        }
    </script>
</body>
